# Render's free plan puts the site to sleep after 15 minutes with no
# visitors, and the next visitor then waits up to a minute for it to wake
# (most leave before it does). This pings the site every 10 minutes so it
# stays awake. One always-on free service fits inside Render's 750 free
# hours a month. If you move to a paid Render plan, delete this file.
#
# GitHub's scheduled runs can occasionally be a few minutes late, so a
# rare cold start can still slip through.
name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Echoly
        run: curl -fsS -o /dev/null --max-time 120 -w "HTTP %{http_code} in %{time_total}s\n" https://echoly-enjr.onrender.com/scenarios
