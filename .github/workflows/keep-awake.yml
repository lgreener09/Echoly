# Uptime check for Echoly.
#
# Every 10 minutes this loads the real site the way a visitor would
# (getecholy.com, following any redirects) and checks the three things a
# new visitor needs: the landing page, the app page, and the lesson list
# from the server. If any of them fails, this run fails, and GitHub emails
# you about the failed run, so an outage gets noticed in minutes instead
# of days.
#
# Make sure GitHub emails are on: GitHub > Settings > Notifications >
# Actions > "Only notify for failed workflows" + Email.
#
# GitHub's scheduled runs can occasionally be a few minutes late.
name: Uptime check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check getecholy.com
        run: |
          set -e
          fail=0
          for url in \
            "https://getecholy.com/" \
            "https://getecholy.com/app.html" \
            "https://getecholy.com/scenarios"
          do
            if curl -fsSL -o /dev/null --max-time 60 -w "$url -> HTTP %{http_code} in %{time_total}s\n" "$url"; then
              :
            else
              echo "::error::DOWN: $url"
              fail=1
            fi
          done
          # The lesson list must actually contain lessons, or nobody can start one.
          if ! curl -fsSL --max-time 60 "https://getecholy.com/scenarios" | grep -q '"scenarios":\[{'; then
            echo "::error::/scenarios returned no lessons"
            fail=1
          fi
          exit $fail